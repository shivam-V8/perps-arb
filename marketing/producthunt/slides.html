<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1270px; height: 760px; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      .slide { position: relative; width: 1270px; height: 760px; display: grid; grid-template-columns: 480px 1fr; gap: 36px; padding: 56px 0 0 64px; overflow: hidden; }
      .slide.dark { color: #fff; }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; background: rgba(255,255,255,.75); color: #0b0d12; padding: 7px 14px; border-radius: 999px; }
      .dark .eyebrow { background: rgba(255,255,255,.1); color: #fff; }
      .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #059669; display: inline-block; }
      h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 66px; line-height: .94; letter-spacing: -.01em; margin-top: 26px; color: #0b0d12; }
      .dark h1 { color: #fff; }
      h1 span { display: block; }
      h1 span:last-child { color: #059669; }
      .dark h1 span:last-child { color: #10b981; }
      p.body { margin-top: 24px; font-size: 19px; line-height: 1.5; color: rgba(11,13,18,.68); max-width: 380px; }
      .dark p.body { color: rgba(255,255,255,.65); }
      .brand { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #0b0d12; }
      .dark .brand { color: #fff; }
      .brand small { font-weight: 500; opacity: .55; font-size: 15px; }
      .stage { position: relative; }
      .browser { position: absolute; left: 0; top: 18px; width: 860px; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px -30px rgba(11,13,18,.45), 0 0 0 1px rgba(11,13,18,.06); }
      .browser .bar { height: 38px; background: #f3f3f1; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,.06); }
      .browser .bar b { width: 11px; height: 11px; border-radius: 50%; background: #e2e1dc; display: inline-block; }
      .browser .bar span { margin-left: 18px; font-size: 13px; color: #6b7079; background: #fff; border-radius: 8px; padding: 4px 14px; }
      .browser img { display: block; width: 100%; }
      .card { position: absolute; left: 0; top: 18px; width: 760px; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(11,13,18,.5); }
      .card img { display: block; width: 100%; }
      .pair img { position: absolute; border-radius: 18px; box-shadow: 0 30px 60px -24px rgba(11,13,18,.45), 0 0 0 1px rgba(11,13,18,.06); background: #fff; }
      .pair img:nth-child(1) { left: 0; top: 30px; width: 470px; }
      .pair img:nth-child(2) { left: 330px; top: 250px; width: 440px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const s = {{SLIDE}};
      const root = document.getElementById("root");
      const stage =
        s.layout === "pair"
          ? `<div class="stage pair">${s.images.map((src) => `<img src="${src}">`).join("")}</div>`
          : s.layout === "card"
            ? `<div class="stage"><div class="card"><img src="${s.images[0]}"></div></div>`
            : `<div class="stage"><div class="browser"><div class="bar"><b></b><b></b><b></b><span>chainmatch.ai</span></div><img src="${s.images[0]}"></div></div>`;
      root.innerHTML = `<div class="slide ${s.dark ? "dark" : ""}" style="background:${s.panel}">
        <div>
          <span class="eyebrow"><i></i>${s.eyebrow}</span>
          <h1>${s.lines.map((l) => `<span>${l}</span>`).join("")}</h1>
          <p class="body">${s.body}</p>
        </div>
        ${stage}
        <div class="brand">
          <svg width="30" height="18" viewBox="0 0 28 16" fill="none"><rect x="1.2" y="1.2" width="15" height="13.6" rx="6.8" stroke="${s.dark ? "#fff" : "#0b0d12"}" stroke-width="2.4"/><rect x="11.8" y="1.2" width="15" height="13.6" rx="6.8" stroke="#10b981" stroke-width="2.4"/></svg>
          ChainMatch <small>chainmatch.ai</small>
        </div>
      </div>`;
    </script>
  </body>
</html>
