# nginx site for chainmatch.ai on the AWS server (behind Cloudflare, SSL mode Full (strict)).
# Installed by scripts/server-setup.sh / manually to /etc/nginx/sites-available/chainmatch.

# real client IP from Cloudflare
real_ip_header CF-Connecting-IP;
include /etc/nginx/cloudflare-ips.conf;

upstream chainmatch_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name chainmatch.ai www.chainmatch.ai;
  return 301 https://chainmatch.ai$request_uri;
}

# one public address: www → apex (same path and query)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.chainmatch.ai;
  ssl_certificate /etc/ssl/chainmatch/origin.pem;
  ssl_certificate_key /etc/ssl/chainmatch/origin.key;
  return 301 https://chainmatch.ai$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name chainmatch.ai;

  ssl_certificate /etc/ssl/chainmatch/origin.pem;
  ssl_certificate_key /etc/ssl/chainmatch/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # hashed build assets never change
  location /_next/static/ {
    proxy_pass http://chainmatch_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://chainmatch_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates TLS for visitors; this hop is always https
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s; # job searches can take a couple of minutes
    proxy_send_timeout 300s;
  }
}

# anything else hitting the IP directly gets nothing
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  ssl_certificate /etc/ssl/chainmatch/origin.pem;
  ssl_certificate_key /etc/ssl/chainmatch/origin.key;
  return 444;
}
