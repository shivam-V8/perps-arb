# Local Postgres for development: `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainmatch
      POSTGRES_PASSWORD: chainmatch
      POSTGRES_DB: chainmatch
    ports:
      - "5433:5432"
    volumes:
      - chainmatch-db:/var/lib/postgresql/data
volumes:
  chainmatch-db:
