services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    ports:
      - "8100:8100"
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./services/ingest/src:/app/src
      - ./shared:/app/shared:ro
    command: ["uv", "run", "uvicorn", "ingest.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    depends_on:
      redis:
        condition: service_healthy
